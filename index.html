<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PANACEA 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen night map. Header (name, search, clock) + live strip on top, full-bleed campus map, time scrubber at the bottom, details slide in from the right (bottom sheet on phones). */
:root {
  --ink: #0A1120;
  --land: #0F192B;
  --block: #17233A;
  --block-line: #2B3D60;
  --road: #1F2E4A;
  --road-major: #273859;
  --lawn: #12302B;
  --heritage: #2A2433;
  --text: #E9EEF8;
  --muted: #8B98B2;
  --faint: #55627D;
  --live: #FF5A6E;
  --soon: #F5B841;
  --idle: #7C93C9;
  --ended: #3A4762;
  --route: #58E0E4;
  --surface: #121C31;
  --surface-2: #19253F;
  --line: #24324F;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 14px;
  display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header { display: flex; align-items: center; gap: 18px; padding-block: 12px; border-bottom: 1px solid var(--line); position: relative; z-index: 6; }
.brand { display: flex; flex-direction: column; gap: 3px; flex: none; }
.wordmark { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 3vw, 32px); letter-spacing: 0.04em; line-height: 1; margin: 0; }
.wordmark span { color: var(--live); font-weight: 500; letter-spacing: 0.02em; }
.sub { color: var(--muted); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; }
.ecg { width: 120px; height: 30px; flex: none; }
.ecg path { fill: none; stroke: var(--live); stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: trace 2.4s ease-out forwards; opacity: .85; }
@keyframes trace { to { stroke-dashoffset: 0; } }
.clock { text-align: right; font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }
.clock b { display: block; font-size: 18px; color: var(--text); font-weight: 500; }

/* Search (shared combobox) */
.combo { position: relative; min-width: 0; }
.search { flex: 1; max-width: 520px; margin-left: auto; }
.combo input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px 10px 36px; outline: none; }
.combo input::placeholder { color: var(--faint); }
.combo input:focus { border-color: var(--route); }
.combo .glass { position: absolute; left: 12px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); pointer-events: none; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 40px rgb(0 0 0 / .5); max-height: min(420px, 60vh); overflow-y: auto; padding: 6px; z-index: 20; }
.results h4 { margin: 6px 8px 4px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.res { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px; cursor: pointer; }
.res[aria-selected="true"], .res:hover { background: var(--surface-2); }
.res .ic { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.res .ic.place { border-radius: 3px; background: var(--faint); }
.res .tx { min-width: 0; display: flex; flex-direction: column; }
.res .tx b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .tx small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .st { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex: none; }
.res .st.live { color: var(--live); }
.noresult { padding: 10px; color: var(--muted); font-size: 13px; }

/* Live strip + filters */
.strip { display: flex; gap: 12px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.strip-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: beat 1.6s infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgb(255 90 110 / .7); } 70% { box-shadow: 0 0 0 8px rgb(255 90 110 / 0); } 100% { box-shadow: 0 0 0 0 rgb(255 90 110 / 0); } }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--faint); }
.chip.live-chip { border-color: rgb(255 90 110 / .45); }
.chip.live-chip small { color: var(--live); font-family: var(--f-mono); margin-left: 6px; }
.chip.filter[aria-pressed="false"] { opacity: .45; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.divider { width: 1px; align-self: stretch; background: var(--line); flex: none; }
.empty { color: var(--faint); font-size: 13px; white-space: nowrap; }

/* Map */
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--ink); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.stage.picking #map { cursor: crosshair; }
.r-edge { stroke: var(--block-line); stroke-linecap: round; stroke-linejoin: round; fill: none; }
.r-fill { stroke: var(--road); stroke-linecap: round; stroke-linejoin: round; fill: none; }
.r-fill.major { stroke: var(--road-major); }
.r-mid { stroke: var(--faint); stroke-dasharray: 8 12; stroke-width: 1.2; fill: none; opacity: .45; }
.place-shape { fill: var(--block); stroke: var(--block-line); stroke-width: 1.5; cursor: pointer; transition: fill .15s; }
.place-shape.heritage { fill: var(--heritage); stroke: #4A3D5A; stroke-dasharray: 5 4; }
.place-shape:hover, .place.selected .place-shape { fill: #1E2D4B; stroke: #4A6699; }
.place.selected .place-shape { stroke: var(--text); stroke-width: 2; }
.plabel { font-family: var(--f-body); fill: var(--muted); font-size: 13px; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
.plabel.est { fill: var(--faint); font-size: 10px; letter-spacing: .12em; }
.pin circle { fill: var(--faint); stroke: var(--land); stroke-width: 2; }
.pin text { font-family: var(--f-body); fill: var(--muted); font-size: 12px; paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
.pin.metro circle { fill: var(--route); }
.pin.metro text { fill: var(--route); font-weight: 600; }
.pin { cursor: pointer; }
.street { font-family: var(--f-body); font-size: 12px; letter-spacing: .14em; fill: var(--faint); text-transform: uppercase; pointer-events: none; }
.gate circle { fill: var(--ink); stroke: var(--route); stroke-width: 2.5; }
.gate text { fill: var(--route); font-size: 12px; font-weight: 600; font-family: var(--f-body); paint-order: stroke; stroke: var(--land); stroke-width: 3px; }

.dot { cursor: pointer; }
.dot .hit { fill: transparent; }
.dot .core { stroke: var(--ink); stroke-width: 2.5; }
.dot .ring { fill: none; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; opacity: 0; }
.dot.live .core { fill: var(--live); }
.dot.live .ring { stroke: var(--live); animation: resonate 2.2s cubic-bezier(.2,.6,.3,1) infinite; }
.dot.live .ring.r2 { animation-delay: .73s; }
.dot.live .ring.r3 { animation-delay: 1.46s; }
@keyframes resonate { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(4.2); opacity: 0; } }
.dot.soon .core { fill: var(--ink); stroke: var(--soon); stroke-width: 3.5; }
.dot.later .core { fill: var(--idle); opacity: .75; }
.dot.ended .core { fill: var(--ended); }
.dot .halo { fill: none; stroke: transparent; stroke-width: 2; stroke-dasharray: 4 4; }
.dot.selected .halo { stroke: var(--text); }
.dot .tag { font-family: var(--f-body); font-size: 13px; font-weight: 600; fill: var(--text); paint-order: stroke; stroke: var(--ink); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.dot.ended .tag, .dot.later .tag, .dot.soon .tag { display: none; }
.dot.selected .tag { display: inline; }

.route-line { fill: none; stroke: var(--route); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 11; animation: march 0.9s linear infinite; }
.route-glow { fill: none; stroke: var(--route); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; opacity: .14; }
@keyframes march { to { stroke-dashoffset: -13; } }
.route-start { fill: var(--ink); stroke: var(--route); stroke-width: 4; }
.route-start-label { font-family: var(--f-body); font-size: 12.5px; font-weight: 600; fill: var(--route); paint-order: stroke; stroke: var(--ink); stroke-width: 4px; }

@media (prefers-reduced-motion: reduce) {
  .dot.live .ring { animation: none; opacity: .5; transform: scale(2.2); }
  .dot.live .ring.r2, .dot.live .ring.r3 { display: none; }
  .route-line { animation: none; }
  .ecg path { animation: none; stroke-dashoffset: 0; }
  .strip-label i { animation: none; }
}

/* Floating map controls */
.ctrls { position: absolute; left: max(16px, calc(env(safe-area-inset-left, 0px) + 12px)); top: 12px; display: flex; flex-direction: column; gap: 6px; }
.ctrls button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; display: grid; place-items: center; }
.ctrls button:hover { background: var(--surface-2); }
.legend { position: absolute; left: max(16px, calc(env(safe-area-inset-left, 0px) + 12px)); bottom: 12px; background: rgb(18 28 49 / .9); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.scale { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; margin-top: 2px; }
.scale b { height: 6px; border: 1.5px solid var(--muted); border-top: 0; display: inline-block; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--route); color: var(--ink); font-weight: 600; padding: 9px 12px 9px 14px; border-radius: 10px; display: flex; gap: 10px; align-items: center; z-index: 4; box-shadow: 0 10px 30px rgb(0 0 0 / .4); max-width: calc(100% - 32px); }
.toast button { border: 0; background: rgb(10 17 32 / .15); border-radius: 6px; padding: 3px 8px; cursor: pointer; color: var(--ink); font-weight: 600; }

/* Detail panel */
#panel { position: absolute; top: 12px; right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: 12px; width: min(380px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgb(0 0 0 / .45); z-index: 3; }
#panel.enter { animation: slidein .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } }
.p-top { display: flex; align-items: center; gap: 10px; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.pill.live { background: rgb(255 90 110 / .16); color: var(--live); }
.pill.soon { background: rgb(245 184 65 / .14); color: var(--soon); }
.pill.later { background: rgb(124 147 201 / .14); color: var(--idle); }
.pill.ended, .pill.place { background: var(--surface-2); color: var(--muted); }
.countdown { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.close { margin-left: auto; width: 32px; height: 32px; flex: none; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; }
#p-title { font-family: var(--f-display); font-weight: 500; font-size: 21px; line-height: 1.2; margin: 0; text-wrap: balance; }
.p-cat { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: -6px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
dt { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
dd { margin: 0; min-width: 0; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.linkish { border: 0; background: none; padding: 0; color: var(--text); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; cursor: pointer; text-align: left; }
.p-desc { margin: 0; color: #C5CEE0; line-height: 1.55; }
.timeline { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.timeline b { position: absolute; inset: 0 auto 0 0; background: var(--live); border-radius: 3px; }
.evlist { display: grid; gap: 4px; }
.evlist button { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; }
.evlist button:hover { background: var(--surface-2); }
.evlist .mono { color: var(--muted); font-size: 12px; flex: none; }
.evlist .nm { min-width: 0; flex: 1; }
.navbox { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.navbox h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--route); color: var(--route); background: rgb(88 224 228 / .08); }
.custom { display: grid; gap: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; }
.custom .combo input { padding-block: 8px; font-size: 13.5px; }
.custom-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.from { font-size: 13px; color: var(--muted); }
.from b { color: var(--text); font-weight: 500; }
.walk { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.walk b { font-family: var(--f-display); font-weight: 500; font-size: 22px; color: var(--route); }
.walk span { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border-radius: 10px; padding: 11px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--route); color: var(--ink); }
.btn.primary:hover { filter: brightness(1.08); }
.hint { font-size: 12px; color: var(--faint); margin: 0; line-height: 1.45; }

/* Time bar */
.timebar { display: flex; align-items: center; gap: 14px; padding-block: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.days { display: flex; gap: 4px; }
.days button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.days button[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); }
.scrub { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
.scrub input { flex: 1; accent-color: var(--live); min-width: 0; }
.scrub output { font-family: var(--f-mono); font-size: 14px; min-width: 48px; }
.mode { font-size: 12px; color: var(--muted); white-space: nowrap; }
.nowbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

@media (max-width: 900px) { .ecg { display: none; } }
@media (max-width: 720px) {
  header { flex-wrap: wrap; gap: 10px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .clock { margin-left: auto; }
  #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 68%; }
  #panel.enter { animation-name: slideup; }
  @keyframes slideup { from { transform: translateY(30px); opacity: 0; } }
  .legend { display: none; }
  .mode { display: none; }
}
</style>

<header class="gutter">
  <div class="brand">
    <h1 class="wordmark">PANACEA <span>2026</span></h1>
    <div class="sub">BMCRI · Bengaluru — Fest Map</div>
  </div>
  <svg class="ecg" viewBox="0 0 160 30" aria-hidden="true"><path d="M0 18 H50 L56 18 L60 11 L64 18 L70 18 L74 27 L80 2 L86 29 L91 18 L100 18 L106 13 L112 18 H160"/></svg>
  <div class="combo search" id="search">
    <svg class="glass" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--muted)" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search events or places — try “quiz” or “Minto”" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="q-results" aria-label="Search events or places">
    <div class="results" id="q-results" role="listbox" hidden></div>
  </div>
  <div class="clock" aria-live="polite"><b id="clock-time">14:30</b><span id="clock-day">Day 1</span></div>
</header>

<div class="strip gutter" id="strip"></div>

<div class="stage" id="stage">
  <svg id="map" role="application" aria-label="BMCRI and Victoria Hospital campus map with fest events"></svg>
  <div class="ctrls">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>

  </div>
  <div class="legend" aria-label="Legend">
    <div><i style="background:var(--live)"></i>Happening now</div>

    <div><i style="background:var(--idle);opacity:.75"></i>Later</div>
    <div><i style="background:var(--ended)"></i>Ended</div>
    <div class="scale"><b id="scalebar" style="width:60px"></b><span>50 m</span></div>

</div>

<div class="timebar gutter">

  <div class="scrub">
    <input type="range" id="t" min="480" max="1380" step="5" value="870" aria-label="Time of day">
    <output id="t-out" for="t">14:30</output>

<script>
/* =====================================================================
   EDIT HERE: fest dates, places and events.
   Map units follow the reference map (about 1560 × 1340, ~0.45 m per unit).
   `q` is what Google Maps searches for when opening directions.
   ===================================================================== */
const FEST = {
  dates: ["2026-11-20", "2026-11-21", "2026-11-22"],   // placeholder dates
  dayNames: ["Day 1", "Day 2", "Day 3"],
};
const M_PER_UNIT = 0.45;
const WALK_M_PER_MIN = 75;

const CATEGORIES = {
  cultural: { name: "Cultural", color: "#FF8A5B" },
  academic: { name: "Academic", color: "#7CB7FF" },
  literary: { name: "Literary", color: "#C59BFF" },
  food:     { name: "Food & Fun", color: "#F5B841" },
  outreach: { name: "Outreach", color: "#FF6FAE" },
  sports:   { name: "Sports", color: "#5BD38A" },
};

// Buildings use `polys` (outline points). Small landmarks use `point`. `lines` overrides the map label.
const PLACES = [
  { id: "victoria", name: "Victoria Hospital", q: "Victoria Hospital, Bengaluru", est: "EST. 1900", anchor: [1045, 120],
    polys: [[[965,45],[1135,45],[1140,100],[1070,210],[965,210]], [[1185,120],[1305,180],[1300,330],[1150,345],[1100,300],[1165,150]]] },
  { id: "dental", name: "Govt. Dental College & Hospital", lines: ["Govt.", "Dental", "College"], q: "Government Dental College and Hospital, Bengaluru",

/* ---------- Walking graph built from the road polylines ---------- */
const G = (() => {
  const segs = [];
  ROADS.forEach((r) => { for (let i = 0; i < r.pts.length - 1; i++) segs.push({ a: r.pts[i], b: r.pts[i + 1], ts: [0, 1] }); });
  const at = (s, t) => [s.a[0] + (s.b[0] - s.a[0]) * t, s.a[1] + (s.b[1] - s.a[1]) * t];
  const proj = (p, s) => { const dx = s.b[0] - s.a[0], dy = s.b[1] - s.a[1], L = dx * dx + dy * dy;
    let t = L ? ((p[0] - s.a[0]) * dx + (p[1] - s.a[1]) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
    const q = at(s, t); return { t, q, d: Math.hypot(p[0] - q[0], p[1] - q[1]) }; };
  // crossings
  for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
    const s = segs[i], o = segs[j];
    const r = [s.b[0] - s.a[0], s.b[1] - s.a[1]], q = [o.b[0] - o.a[0], o.b[1] - o.a[1]];
    const den = r[0] * q[1] - r[1] * q[0]; if (Math.abs(den) < 1e-9) continue;
    const w = [o.a[0] - s.a[0], o.a[1] - s.a[1]];
    const t = (w[0] * q[1] - w[1] * q[0]) / den, u = (w[0] * r[1] - w[1] * r[0]) / den;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) { s.ts.push(t); o.ts.push(u); }
  }
  // near-touching ends (T-junctions)
  const extra = [];
  segs.forEach((s, i) => [s.a, s.b].forEach((p) => segs.forEach((o, j) => { if (i === j) return; const r = proj(p, o); if (r.d > 0.5 && r.d < 20) { o.ts.push(r.t); extra.push([p, r.q]); } })));
  const key = (p) => `${Math.round(p[0])},${Math.round(p[1])}`;
  const nodes = {}, adj = {}, edges = [];
  const link = (p, q) => { const a = key(p), b = key(q); if (a === b) return; nodes[a] = p; nodes[b] = q; const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
    (adj[a] ||= []).push([b, d]); (adj[b] ||= []).push([a, d]); edges.push({ a, b, s: { a: p, b: q } }); };
  for (const s of segs) { const ts = [...new Set(s.ts.map((t) => +t.toFixed(5)))].sort((x, y) => x - y); for (let k = 0; k < ts.length - 1; k++) link(at(s, ts[k]), at(s, ts[k + 1])); }
  extra.forEach(([p, q]) => link(p, q));
  return { nodes, adj, edges, proj };
})();
function snap(p) { let best = null; for (const e of G.edges) { const r = G.proj(p, e.s); if (!best || r.d < best.d) best = { ...r, e }; } return best; }
function walkRoute(from, to) {
  const A = snap(from), B = snap(to);
  const adj = new Map(Object.entries(G.adj).map(([k, v]) => [k, [...v]]));
  const add = (id, sn) => { const ea = G.nodes[sn.e.a], eb = G.nodes[sn.e.b]; const da = Math.hypot(sn.q[0] - ea[0], sn.q[1] - ea[1]), db = Math.hypot(sn.q[0] - eb[0], sn.q[1] - eb[1]);
    adj.set(id, [[sn.e.a, da], [sn.e.b, db]]); adj.get(sn.e.a).push([id, da]); adj.get(sn.e.b).push([id, db]); };
  add("A", A); add("B", B);
  if (A.e === B.e) { const d = Math.hypot(A.q[0] - B.q[0], A.q[1] - B.q[1]); adj.get("A").push(["B", d]); adj.get("B").push(["A", d]); }
  const pos = (k) => k === "A" ? A.q : k === "B" ? B.q : G.nodes[k];
  const dist = new Map([["A", 0]]), prev = new Map(), done = new Set();
  while (true) {
    let u = null, ud = Infinity; for (const [k, d] of dist) if (!done.has(k) && d < ud) { u = k; ud = d; }
    if (u === null || u === "B") break; done.add(u);
    for (const [v, w] of adj.get(u) || []) if (ud + w < (dist.get(v) ?? Infinity)) { dist.set(v, ud + w); prev.set(v, u); }
  }
  const keys = ["B"]; while (keys[0] !== "A" && prev.has(keys[0])) keys.unshift(prev.get(keys[0]));
  const pts = [from, ...keys.map(pos), to];
  let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return { pts, meters: Math.max(10, Math.round(len * M_PER_UNIT / 10) * 10) };
}

    const g = el("g", { class: `dot ${s}${sel ? " selected" : ""}`, transform: `translate(${x} ${y})`, tabindex: 0, role: "button", "aria-label": `${e.title}, ${P[e.venue].name}, ${e.start} to ${e.end}`, "data-id": e.id }, dotLayer);

    el("circle", { class: "halo", r: 16 }, g);
    el("circle", { class: "core", r: sel ? 10 : 8 }, g);
    el("text", { class: "tag", x: 16, y: 5 }, g).textContent = e.title.length > 28 ? e.title.slice(0, 27) + "…" : e.title;
  }
}

/* ---------- Starting points ---------- */
function resolveStart() {
  const s = state.start;
  if (s.type === "preset") { const st = STARTS.find((x) => x.id === s.id); if (st.place) { const p = P[st.place]; return { at: anchor(p), label: st.name, q: gmapsQ(p) }; } return { at: st.at, label: st.name, q: null }; }
  if (s.type === "place") { const p = P[s.id]; return { at: anchor(p), label: p.name, q: gmapsQ(p) }; }
  if (s.type === "event") { const e = E[s.id], p = P[e.venue]; return { at: anchor(p), label: `${e.title} (${p.name})`, q: gmapsQ(p) }; }
  return { at: [s.x, s.y], label: "Pinned spot on map", q: null };
}
function drawRoute(dest) {
  routeLayer.replaceChildren();
  if (!dest) return null;
  const st = resolveStart(), r = walkRoute(st.at, dest), d = r.pts.map((p) => p.join(",")).join(" ");
  el("polyline", { points: d, class: "route-glow" }, routeLayer);
  el("polyline", { points: d, class: "route-line" }, routeLayer);
  el("circle", { cx: st.at[0], cy: st.at[1], r: 10, class: "route-start" }, routeLayer);
  el("text", { x: st.at[0] + 15, y: st.at[1] - 12, class: "route-start-label" }, routeLayer).textContent = "Start: " + (st.label.length > 30 ? st.label.slice(0, 29) + "…" : st.label);
  return { ...r, st };
}

/* ---------- Search ---------- */
function searchAll(q, { includeEvents = true } = {}) {
  q = q.trim().toLowerCase();
  const score = (txt) => { txt = txt.toLowerCase(); if (!q) return 1; if (txt.startsWith(q)) return 3; if (txt.split(/[\s&().,:·-]+/).some((w) => w.startsWith(q))) return 2; return txt.includes(q) ? 1 : 0; };
  const evs = !includeEvents ? [] : EVENTS.map((e) => ({ e, s: Math.max(score(e.title), score(P[e.venue].name) * 0.8, score(CATEGORIES[e.cat].name) * 0.7, score(e.org) * 0.6) }))
    .filter((x) => x.s > 0 && (q || (x.e.day === state.day && status(x.e) === "live")))
    .sort((a, b) => b.s - a.s || (a.e.day - b.e.day) || toMin(a.e.start) - toMin(b.e.start)).slice(0, 8).map((x) => x.e);
  const places = PLACES.map((p) => ({ p, s: score(p.name) })).filter((x) => x.s > 0 && q).sort((a, b) => b.s - a.s).slice(0, 6).map((x) => x.p);
  return { evs, places };
}
function makeCombo(input, box, onPick, opts = {}) {
  let items = [], active = -1;
  const close = () => { box.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; };
  const render = () => {
    const { evs, places } = searchAll(input.value, opts);
    items = [...evs.map((e) => ({ kind: "event", id: e.id })), ...places.map((p) => ({ kind: "place", id: p.id }))];
    let h = "";
    if (evs.length) h += `<h4>${input.value.trim() ? "Events" : "Live now"}</h4>` + evs.map((e, i) => { const s = status(e);
      return `<button class="res" role="option" data-i="${i}"><span class="ic" style="background:${CATEGORIES[e.cat].color}"></span><span class="tx"><b>${esc(e.title)}</b><small>${esc(P[e.venue].name)} · ${FEST.dayNames[e.day]} ${e.start}–${e.end}</small></span><span class="st ${e.day === state.day && s === "live" ? "live" : ""}">${e.day === state.day ? LABEL[s] : FEST.dayNames[e.day]}</span></button>`; }).join("");
    if (places.length) h += `<h4>Places</h4>` + places.map((p, i) => { const n = EVENTS.filter((e) => e.venue === p.id && e.day === state.day).length;
      return `<button class="res" role="option" data-i="${evs.length + i}"><span class="ic place"></span><span class="tx"><b>${esc(p.name)}</b><small>${n ? `${n} event${n > 1 ? "s" : ""} on ${FEST.dayNames[state.day]}` : "On the map"}</small></span></button>`; }).join("");
    if (!items.length) h = input.value.trim() ? `<div class="noresult">Nothing matches “${esc(input.value.trim())}”. Try a building name or event.</div>` : `<div class="noresult">Type an event, category or building name.</div>`;
    box.innerHTML = h; box.hidden = false; input.setAttribute("aria-expanded", "true"); active = -1;
    box.querySelectorAll(".res").forEach((b) => b.addEventListener("mousedown", (ev) => { ev.preventDefault(); pick(+b.dataset.i); }));
  };
  const pick = (i) => { const it = items[i]; if (!it) return; close(); onPick(it); };
  const hl = () => box.querySelectorAll(".res").forEach((b) => b.setAttribute("aria-selected", +b.dataset.i === active));
  input.addEventListener("input", render);
  input.addEventListener("focus", render);
  input.addEventListener("blur", () => setTimeout(close, 120));
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); active = Math.min(items.length - 1, active + 1); hl(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); active = Math.max(0, active - 1); hl(); }
    else if (ev.key === "Enter") { ev.preventDefault(); pick(active >= 0 ? active : 0); }
    else if (ev.key === "Escape") { close(); input.blur(); }
  });
}
makeCombo($("#q"), $("#q-results"), (it) => {
  $("#q").value = it.kind === "event" ? E[it.id].title : P[it.id].name;
  select(it);
  $("#q").blur();
});

/* ---------- Detail panel ---------- */
const panel = $("#panel");
function navBox(destPlace) {
  const r = drawRoute(anchor(destPlace)), same = r.meters <= 20;
  const custom = state.start.type !== "preset";
  const origin = r.st.q ? `&origin=${encodeURIComponent(r.st.q)}` : "";
  const gmaps = `https://www.google.com/maps/dir/?api=1${origin}&destination=${encodeURIComponent(gmapsQ(destPlace))}&travelmode=walking`;
  return `
    <div class="navbox">
      <h3>Starting point</h3>
      <div class="seg">${STARTS.map((s) => `<button data-start="${s.id}" aria-pressed="${state.start.type === "preset" && state.start.id === s.id}">${s.name}</button>`).join("")}
        <button data-start="custom" aria-pressed="${custom || state.customOpen}">Custom…</button></div>
      ${custom || state.customOpen ? `
      <div class="custom">
        <div class="combo"><svg class="glass" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--muted)" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="start-q" type="search" autocomplete="off" placeholder="Type a building or event" aria-label="Custom starting point">
          <div class="results" id="start-results" hidden></div></div>
        <div class="custom-row"><button class="ghost" id="pick">Tap a spot on the map</button>${custom ? `<span class="from">From <b>${esc(r.st.label)}</b></span>` : ""}</div>
      </div>` : ""}
      <div class="walk">${same ? `<b>You're here</b>` : `<b>${Math.max(1, Math.ceil(r.meters / WALK_M_PER_MIN))} min walk</b><span>≈ ${r.meters} m · route on map</span>`}</div>
      <a class="btn primary" href="${gmaps}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
      <p class="hint">${r.st.q ? "Google Maps opens with this start and destination filled in." : "Google Maps starts from your current location and gives turn-by-turn directions."}</p>
    </div>`;
}
function wireNav() {
  panel.querySelectorAll("[data-start]").forEach((b) => b.onclick = () => {
    if (b.dataset.start === "custom") { state.customOpen = true; renderPanel(); $("#start-q")?.focus(); return; }
    state.start = { type: "preset", id: b.dataset.start }; state.customOpen = false; renderPanel();
  });
  const sq = $("#start-q");
  if (sq) makeCombo(sq, $("#start-results"), (it) => { state.start = { type: it.kind, id: it.id }; state.customOpen = true; renderPanel(); }, { includeEvents: true });
  const pk = $("#pick"); if (pk) pk.onclick = () => setPicking(true);
}
function renderPanel(animate) {
  const sel = state.sel;
  if (!sel) { panel.hidden = true; drawRoute(null); return; }
  if (animate) { panel.classList.remove("enter"); void panel.offsetWidth; panel.classList.add("enter"); }
  if (sel.kind === "event") {
    const e = E[sel.id], s = status(e), p = P[e.venue], st = toMin(e.start), en = toMin(e.end), today = e.day === state.day;
    const cd = !today ? `${FEST.dayNames[e.day]}` : s === "live" ? `Ends in ${dur(en - state.t)}` : s === "ended" ? `Ended ${dur(state.t - en)} ago` : `Starts in ${dur(st - state.t)}`;
    const pct = Math.max(0, Math.min(100, ((state.t - st) / (en - st)) * 100));
    panel.innerHTML = `
      <div class="p-top"><span class="pill ${s}">${LABEL[s]}</span><span class="countdown">${cd}</span><button class="close" id="p-close" aria-label="Close details">×</button></div>
      <h2 id="p-title">${esc(e.title)}</h2>
      <div class="p-cat"><span class="sw" style="background:${CATEGORIES[e.cat].color}"></span>${CATEGORIES[e.cat].name}</div>
      ${s === "live" && today ? `<div class="timeline" aria-hidden="true"><b style="width:${pct}%"></b></div>` : ""}
      <dl>
        <dt>When</dt><dd>${FEST.dayNames[e.day]} · <span class="mono">${e.start} – ${e.end}</span></dd>
        <dt>Where</dt><dd><button class="linkish" id="p-place">${esc(p.name)}</button></dd>
        <dt>By</dt><dd>${esc(e.org)}</dd>
      </dl>
      <p class="p-desc">${esc(e.desc)}</p>
      ${navBox(p)}`;
    $("#p-place").onclick = () => select({ kind: "place", id: p.id });
  } else {
    const p = P[sel.id], evs = EVENTS.filter((e) => e.venue === p.id && e.day === state.day).sort((a, b) => toMin(a.start) - toMin(b.start));
    panel.innerHTML = `
      <div class="p-top"><span class="pill place">Place</span><span class="countdown">${evs.length ? `${evs.length} event${evs.length > 1 ? "s" : ""} on ${FEST.dayNames[state.day]}` : `No events on ${FEST.dayNames[state.day]}`}</span><button class="close" id="p-close" aria-label="Close details">×</button></div>
      <h2 id="p-title">${esc(p.name)}</h2>
      ${evs.length ? `<div class="evlist">${evs.map((e) => { const s = status(e); return `<button data-ev="${e.id}"><span class="mono">${e.start}</span><span class="nm">${esc(e.title)}</span><span class="pill ${s}">${LABEL[s]}</span></button>`; }).join("")}</div>` : ""}
      ${navBox(p)}`;
    panel.querySelectorAll("[data-ev]").forEach((b) => b.onclick = () => select({ kind: "event", id: b.dataset.ev }));
  }
  panel.hidden = false;
  $("#p-close").onclick = () => select(null);
  wireNav();
}
function select(sel, focus = true) {
  const opening = !state.sel && sel;
  state.sel = sel;
  if (sel?.kind === "event" && E[sel.id].day !== state.day) { state.day = E[sel.id].day; state.follow = false; renderDays(); renderClock(); renderStrip(); }
  renderDots(); renderPanel(opening);
  if (sel && focus) {
    const [cx, cy] = anchor(P[sel.kind === "event" ? E[sel.id].venue : sel.id]);
    const w = Math.min(vb.w, 900), h = w * (BASE.h / BASE.w), wide = svg.clientWidth > 720;
    animateTo({ x: cx - w / 2 + (wide ? w * 0.18 : 0), y: cy - h / 2 + (wide ? 0 : h * 0.25), w, h });
  }
}
function setPicking(on) {
  state.picking = on; $("#stage").classList.toggle("picking", on); $("#toast").hidden = !on;
  if (on && innerWidth <= 720) panel.hidden = true; else if (!on) renderPanel();
}
$("#toast-cancel").onclick = () => setPicking(false);

/* ---------- Strip, days, clock ---------- */
function renderStrip() {
  const strip = $("#strip"); strip.replaceChildren();
  const live = EVENTS.filter((e) => e.day === state.day && status(e) === "live" && state.cats.has(e.cat));
  const lab = document.createElement("span"); lab.className = "strip-label"; lab.innerHTML = `<i></i>Live now · ${live.length}`; strip.appendChild(lab);
  if (!live.length) { const em = document.createElement("span"); em.className = "empty"; em.textContent = "Nothing on right now. Blue dots show what's next."; strip.appendChild(em); }
  for (const e of live) { const c = document.createElement("button"); c.className = "chip live-chip"; c.innerHTML = `${esc(e.title)}<small>till ${e.end}</small>`; c.onclick = () => select({ kind: "event", id: e.id }); strip.appendChild(c); }
  const dv = document.createElement("span"); dv.className = "divider"; strip.appendChild(dv);
  for (const [k, c] of Object.entries(CATEGORIES)) {
    const f = document.createElement("button"); f.className = "chip filter"; f.setAttribute("aria-pressed", state.cats.has(k));
    f.innerHTML = `<span class="sw" style="background:${c.color}"></span>${c.name}`;
    f.onclick = () => { state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k); renderStrip(); renderDots(); };
    strip.appendChild(f);
  }
}
function renderDays() {
  $("#days").innerHTML = FEST.dayNames.map((n, i) => `<button data-day="${i}" aria-pressed="${i === state.day}">${n}</button>`).join("");
  $("#days").querySelectorAll("button").forEach((b) => b.onclick = () => { state.day = +b.dataset.day; state.follow = false; if (state.sel?.kind === "event" && E[state.sel.id].day !== state.day) state.sel = null; refresh(); });
}
function renderClock() {
  $("#t").value = state.t; $("#t-out").textContent = fmt(state.t); $("#clock-time").textContent = fmt(state.t);
  const live = state.follow && todayIdx() === state.day;
  $("#clock-day").textContent = `${FEST.dayNames[state.day]} · ${live ? "live" : "preview"}`;
  $("#mode").textContent = live ? "Following the clock" : state.follow ? "Clock time, preview day" : "Preview time";
}
function refresh() { renderDays(); renderClock(); renderStrip(); renderDots(); renderPanel(); }

/* ---------- Pan & zoom ---------- */
function clampVB(v) {
  v.w = Math.max(320, Math.min(2400, v.w)); v.h = v.w * (BASE.h / BASE.w);
  v.x = Math.max(-500, Math.min(1560 - v.w * 0.3, v.x)); v.y = Math.max(-500, Math.min(1340 - v.h * 0.3, v.y));
  return v;
}
function toSvg(cx, cy) { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(px, py, f) { vb = clampVB({ x: px - (px - vb.x) * f, y: py - (py - vb.y) * f, w: vb.w * f, h: vb.h * f }); setVB(); }
let anim;
function animateTo(target) {
  cancelAnimationFrame(anim); target = clampVB({ ...target });
  const from = { ...vb }, t0 = performance.now(), D = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 480;
  const step = (now) => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
    for (const key of ["x", "y", "w", "h"]) vb[key] = from[key] + (target[key] - from[key]) * e;
    setVB(); if (k < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function updateScale() { const ctm = svg.getScreenCTM(); if (ctm) $("#scalebar").style.width = (50 / M_PER_UNIT) * ctm.a + "px"; }

const ptrs = new Map(); let drag = null, moved = 0, pinchPrev = null;
svg.addEventListener("pointerdown", (ev) => {
  svg.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]); cancelAnimationFrame(anim);
  if (ptrs.size === 1) { drag = { cx: ev.clientX, cy: ev.clientY, vb: { ...vb }, k: 1 / svg.getScreenCTM().a, dot: ev.target.closest(".dot"), place: ev.target.closest("[data-place]") }; moved = 0; }
  else { drag = null; pinchPrev = null; }
});
svg.addEventListener("pointermove", (ev) => {
  if (!ptrs.has(ev.pointerId)) return;
  ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (pinchPrev) { const p = toSvg(m[0], m[1]); zoomAt(p.x, p.y, pinchPrev.d / d);
      const k = 1 / svg.getScreenCTM().a; vb.x -= (m[0] - pinchPrev.m[0]) * k; vb.y -= (m[1] - pinchPrev.m[1]) * k; clampVB(vb); setVB(); }
    pinchPrev = { d, m }; moved = 99; return;
  }
  if (!drag) return;
  const dx = ev.clientX - drag.cx, dy = ev.clientY - drag.cy; moved = Math.max(moved, Math.hypot(dx, dy));
  if (moved > 4) { svg.classList.add("dragging"); vb = clampVB({ ...drag.vb, x: drag.vb.x - dx * drag.k, y: drag.vb.y - dy * drag.k }); setVB(); }
});
const endPtr = (ev) => {
  ptrs.delete(ev.pointerId); svg.classList.remove("dragging");
  if (ev.type === "pointerup" && drag && moved <= 4) {
    if (state.picking) { const p = toSvg(ev.clientX, ev.clientY); state.start = { type: "point", x: Math.round(p.x), y: Math.round(p.y) }; state.customOpen = true; setPicking(false); }
    else if (drag.dot) select({ kind: "event", id: drag.dot.dataset.id });
    else if (drag.place) select({ kind: "place", id: drag.place.dataset.place });
    else if (state.sel) select(null, false);
  }
  if (ptrs.size < 2) pinchPrev = null; if (ptrs.size === 0) drag = null;
};
svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("wheel", (ev) => { ev.preventDefault(); const p = toSvg(ev.clientX, ev.clientY); zoomAt(p.x, p.y, Math.exp(ev.deltaY * 0.0015)); }, { passive: false });
svg.addEventListener("keydown", (ev) => { const d = ev.target.closest?.(".dot"); if (d && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); select({ kind: "event", id: d.dataset.id }); } });
const zoomCenter = (f) => animateTo({ x: vb.x + vb.w * (1 - f) / 2, y: vb.y + vb.h * (1 - f) / 2, w: vb.w * f, h: vb.h * f });
$("#zin").onclick = () => zoomCenter(0.7); $("#zout").onclick = () => zoomCenter(1.4); $("#zfit").onclick = () => animateTo({ ...BASE });
document.addEventListener("keydown", (ev) => { if (ev.key !== "Escape") return; if (state.picking) setPicking(false); else if (state.sel && !ev.target.closest?.("input")) select(null, false); });
new ResizeObserver(updateScale).observe(svg);

/* ---------- Time controls ---------- */
$("#t").addEventListener("input", (ev) => { state.t = +ev.target.value; state.follow = false; renderClock(); renderStrip(); renderDots(); renderPanel(); });
$("#nowbtn").onclick = () => { const ti = todayIdx(); if (ti >= 0) state.day = ti; state.follow = true; state.t = Math.max(480, Math.min(1380, nowMin())); refresh(); };
setInterval(() => { if (!state.follow) return; const t = Math.max(480, Math.min(1380, nowMin()));
  if (t !== state.t && !document.activeElement?.matches?.("#panel input")) { state.t = t; refresh(); } }, 20000);

/* ---------- Boot ---------- */
drawBase(); svg.appendChild(routeLayer); svg.appendChild(dotLayer); setVB();
if (todayIdx() >= 0) { state.day = todayIdx(); state.follow = true; state.t = Math.max(480, Math.min(1380, nowMin())); }
refresh();
</script>

</body></html>
