<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PANACEA 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..900&family=Jost:wght@300..600&display=swap">
<style>
/* Layout: one-screen night map in the poster's oxblood and gold. Header + live strip on top, a map that always covers the whole stage (never any empty margin), time scrubber at the bottom, details in a gold-framed panel on the right (bottom sheet on phones). */
:root {
  --ink: #16050a;
  --land: #2a0d11;
  --campus: #3a1a15;
  --dental: #47281a;
  --road-out: #4a2226;
  --road-in: #6a4d28;
  --road-per: #77582c;
  --road-edge: #1d0a0c;
  --text: #f3d98c;
  --muted: #d4ad5e;
  --faint: #b08d47;
  --gold-hi: #ffe58a;
  --gold: #d9ac47;
  --gold-lo: #8a5c12;
  --gold-grad: linear-gradient(180deg, #fff0a6 0%, #e2b74c 48%, #9a6a1a 100%);
  --live: #ffd56a;
  --soon: #f0a24a;
  --idle: #b8975a;
  --ended: #5b3b36;
  --route: #fff3d0;
  --surface: #230a0e;
  --surface-2: #35141a;
  --line: #5d3d26;
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", "Playfair Display", Georgia, serif;
  --f-body: "Jost", "Futura", "Century Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Jost", "Futura", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--text); font-family: var(--f-body); font-size: 14px; font-variant-numeric: tabular-nums;
  background-color: var(--ink);
  background-image: radial-gradient(120% 90% at 50% 38%, #3a1417 0%, var(--ink) 75%);
  display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.gutter { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }

/* Header */
header { display: flex; align-items: center; gap: 18px; padding-block: 14px 12px; border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, transparent, rgb(217 172 71 / .7) 18%, rgb(217 172 71 / .7) 82%, transparent) 1; position: relative; z-index: 6; }
.brand { display: flex; flex-direction: column; gap: 5px; flex: none; }
.wordmark { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: .03em; line-height: 1; margin: 0;
  background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(1.5px 2px 0 #4a2d07); }
.wordmark span { font-weight: 500; letter-spacing: .08em; }
.sub { color: var(--muted); font-size: 10.5px; font-weight: 400; letter-spacing: .26em; text-transform: uppercase; }
.sub .long { display: none; }
.clock { text-align: right; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; flex: none; }
.clock b { display: block; font-family: var(--f-display); font-size: 22px; letter-spacing: .06em; color: var(--gold-hi); font-weight: 600; line-height: 1.1; }

/* Search (shared combobox) */
.combo { position: relative; min-width: 0; }
.search { flex: 1; max-width: 520px; margin-left: auto; }
.combo input { width: 100%; border: 1px solid var(--line); background: rgb(35 10 14 / .85); border-radius: 4px; padding: 10px 12px 10px 36px; outline: none; letter-spacing: .03em; }
.combo input::placeholder { color: var(--faint); }
.combo input:focus { border-color: var(--gold); }
.combo .glass { position: absolute; left: 12px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); pointer-events: none; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--gold-lo); border-radius: 4px; box-shadow: 0 18px 40px rgb(0 0 0 / .6); max-height: min(420px, 60vh); overflow-y: auto; padding: 6px; z-index: 20; }
.results h4 { margin: 6px 8px 4px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.res { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 3px; padding: 8px; cursor: pointer; }
.res[aria-selected="true"], .res:hover { background: var(--surface-2); }
.res .ic { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.res .ic.place { border-radius: 2px; background: var(--faint); }
.res .tx { min-width: 0; display: flex; flex-direction: column; }
.res .tx b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .tx small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .st { margin-left: auto; font-size: 11px; letter-spacing: .08em; color: var(--muted); flex: none; }
.res .st.live { color: var(--live); }
.noresult { padding: 10px; color: var(--muted); font-size: 13px; }

/* Live strip + filters */
.strip { display: flex; gap: 10px; align-items: center; padding-block: 8px; border-bottom: 1px solid rgb(93 61 38 / .6); overflow-x: auto; scrollbar-width: none; background: rgb(22 5 10 / .55); }
.strip::-webkit-scrollbar { display: none; }
.strip-label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.strip-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: beat 1.6s infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgb(255 213 106 / .7); } 70% { box-shadow: 0 0 0 8px rgb(255 213 106 / 0); } 100% { box-shadow: 0 0 0 0 rgb(255 213 106 / 0); } }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; letter-spacing: .03em; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--gold); }
.chip.live-chip { border-color: rgb(255 213 106 / .55); }
.chip.live-chip small { color: var(--live); margin-left: 8px; letter-spacing: .06em; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; vertical-align: 1px; }
.divider { width: 1px; align-self: stretch; background: var(--line); flex: none; }
.empty { color: var(--faint); font-size: 13px; white-space: nowrap; }

/* Map */
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--land); }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.stage.picking #map { cursor: crosshair; }
.r-out { fill: var(--road-out); fill-rule: evenodd; }
.r-edge { stroke: var(--road-edge); stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: .55; }
.r-fill { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.r-fill.minor { stroke: var(--road-in); }
.r-fill.major { stroke: var(--road-per); }
.r-fill.out { stroke: var(--road-out); }
.campus { fill: var(--campus); stroke: none; }
.bld { fill: #45241f; stroke: #6b4830; stroke-width: .9; fill-rule: evenodd; stroke-linejoin: round; }
.vshape .vb { fill: #693824; stroke: #c99a45; stroke-width: 1.2; fill-rule: evenodd; stroke-linejoin: round; cursor: pointer; transition: fill .15s; }
.vshape:hover .vb { fill: #84472b; stroke: var(--gold-hi); }
.vshape.selected .vb { fill: #94512f; stroke: var(--gold-hi); stroke-width: 2.2; }
.roads { pointer-events: none; }
.campus-glow { fill: none; stroke: var(--gold); stroke-width: 56; stroke-linejoin: round; opacity: .06; }
.dental-area { fill: var(--dental); }
.plabel { font-family: var(--f-body); fill: var(--text); font-size: calc(13.5px * var(--fs, 1)); letter-spacing: .01em; pointer-events: none; paint-order: stroke; stroke: var(--campus); stroke-width: 3.5px; stroke-linejoin: round; }
.pin { cursor: pointer; }
.pin .hit { fill: transparent; stroke: none; }
.pin .mk { fill: var(--gold); stroke: var(--ink); stroke-width: 1.6; }
.pin .tail { fill: var(--gold); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.pin .glyph { fill: var(--ink); font-family: var(--f-body); font-weight: 700; font-size: 15px; text-anchor: middle; pointer-events: none; }
.pin .cap { fill: var(--ink); }
.pin.metro .mk { fill: var(--route); }
.pin.minor { display: none; }
.zoomed .pin.minor, .pin.minor.selected { display: inline; }
.pin.minor .dotmk { fill: var(--faint); stroke: var(--campus); stroke-width: 2; }
.pin.minor .plabel { fill: var(--muted); font-size: calc(12px * var(--fs, 1)); }
.pin.selected .mk, .pin.selected .tail { stroke: var(--gold-hi); stroke-width: 2.4; }
.pin.minor.selected .dotmk { fill: var(--gold-hi); }
.street { font-family: var(--f-body); font-size: calc(14px * var(--fs, 1)); font-weight: 500; letter-spacing: .03em; fill: var(--gold-hi); pointer-events: none; opacity: .8; text-anchor: middle; paint-order: stroke; stroke: var(--road-per); stroke-width: 0; }
.bus { fill: var(--muted); opacity: .55; }
.gate circle { fill: var(--ink); stroke: var(--route); stroke-width: 2.5; }
.gate text { fill: var(--route); font-size: calc(12px * var(--fs, 1)); font-weight: 600; font-family: var(--f-body); letter-spacing: .04em; paint-order: stroke; stroke: var(--campus); stroke-width: 3px; }

.dot { cursor: pointer; }
.dot .hit { fill: transparent; }
.dot .core { stroke: var(--ink); stroke-width: 2.5; }
.dot .ring { fill: none; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; opacity: 0; }
.dot.live .core { fill: var(--live); }
.dot.live .ring { stroke: var(--live); animation: resonate 2.2s cubic-bezier(.2,.6,.3,1) infinite; }
.dot.live .ring.r2 { animation-delay: .73s; }
.dot.live .ring.r3 { animation-delay: 1.46s; }
@keyframes resonate { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(4.2); opacity: 0; } }
.dot.soon .core { fill: var(--ink); stroke: var(--soon); stroke-width: 3.5; }
.dot.later .core { fill: var(--idle); opacity: .75; }
.dot.ended .core { fill: var(--ended); }
.dot .halo { fill: none; stroke: transparent; stroke-width: 2; stroke-dasharray: 4 4; }
.dot.selected .halo { stroke: var(--gold-hi); }
.dot .tag { font-family: var(--f-body); font-size: calc(13px * var(--fs, 1)); font-weight: 600; letter-spacing: .02em; fill: var(--text); paint-order: stroke; stroke: var(--ink); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.dot .tag { display: none; }
.zoomed .dot.live .tag, .dot.selected .tag { display: inline; }

.route-line { fill: none; stroke: var(--route); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 11; animation: march 0.9s linear infinite; }
.route-glow { fill: none; stroke: var(--gold); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; opacity: .2; }
@keyframes march { to { stroke-dashoffset: -13; } }
.route-start { fill: var(--ink); stroke: var(--route); stroke-width: 4; }
.route-start-label { font-family: var(--f-body); font-size: calc(12.5px * var(--fs, 1)); font-weight: 600; letter-spacing: .03em; fill: var(--route); paint-order: stroke; stroke: var(--ink); stroke-width: 4px; }

@media (prefers-reduced-motion: reduce) {
  .dot.live .ring { animation: none; opacity: .5; transform: scale(2.2); }
  .dot.live .ring.r2, .dot.live .ring.r3 { display: none; }
  .route-line { animation: none; }
  .strip-label i { animation: none; }
}

/* Floating map controls */
.ctrls { position: absolute; z-index: 2; left: max(16px, calc(env(safe-area-inset-left, 0px) + 12px)); top: 12px; display: flex; flex-direction: column; gap: 6px; }
.ctrls button { width: 36px; height: 36px; border-radius: 4px; border: 1px solid var(--gold-lo); background: rgb(35 10 14 / .92); color: var(--gold-hi); cursor: pointer; font-size: 18px; line-height: 1; display: grid; place-items: center; }
.ctrls button:hover { background: var(--surface-2); border-color: var(--gold); }
.fbtn { position: relative; }
.fbtn.on::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--soon); }
.fpop { position: absolute; z-index: 4; left: max(60px, calc(env(safe-area-inset-left, 0px) + 56px)); top: 12px; width: min(250px, calc(100% - 80px)); background: rgb(35 10 14 / .96); border: 1px solid var(--gold-lo); border-radius: 4px; padding: 12px; display: grid; gap: 4px; box-shadow: 0 16px 36px rgb(0 0 0 / .55); }
.fpop h4 { margin: 0 0 4px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.fpop .row { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; border-radius: 3px; padding: 7px 6px; cursor: pointer; text-align: left; font-size: 13.5px; }
.fpop .row:hover { background: var(--surface-2); }
.fpop .row[aria-pressed="false"] { opacity: .4; }
.fpop .key { display: grid; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.fpop .key div { display: flex; align-items: center; gap: 8px; }
.fpop .key i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.scale { position: absolute; z-index: 2; left: max(16px, calc(env(safe-area-inset-left, 0px) + 12px)); bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); pointer-events: none; text-shadow: 0 0 4px var(--ink); }
.scale b { height: 6px; border: 1.5px solid var(--muted); border-top: 0; display: inline-block; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--gold-grad); color: #2a0d10; font-weight: 600; letter-spacing: .03em; padding: 9px 12px 9px 14px; border-radius: 4px; display: flex; gap: 10px; align-items: center; z-index: 4; box-shadow: 0 10px 30px rgb(0 0 0 / .5); max-width: calc(100% - 32px); }
.toast button { border: 0; background: rgb(42 13 16 / .18); border-radius: 3px; padding: 3px 8px; cursor: pointer; color: #2a0d10; font-weight: 600; }

/* Detail panel: double gold frame, like the poster border */
#panel { position: absolute; top: 12px; right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: 12px; width: min(380px, calc(100% - 24px));
  background: linear-gradient(180deg, #321118 0%, var(--surface) 100%); border: 1px solid var(--gold-lo); border-radius: 4px; padding: 20px 20px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 20px 50px rgb(0 0 0 / .6), inset 0 0 0 4px var(--surface), inset 0 0 0 5px rgb(217 172 71 / .32); z-index: 3; }
#panel.enter { animation: slidein .28s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } }
.p-top { display: flex; align-items: center; gap: 10px; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.live { background: rgb(255 213 106 / .16); color: var(--live); }
.pill.soon { background: rgb(240 162 74 / .15); color: var(--soon); }
.pill.later { background: rgb(184 151 90 / .15); color: var(--idle); }
.pill.ended, .pill.place { background: var(--surface-2); color: var(--muted); }
.countdown { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.close { margin-left: auto; width: 32px; height: 32px; flex: none; border-radius: 4px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; }
.close:hover { border-color: var(--gold); }
#p-title { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.2; margin: 0; color: var(--gold-hi); text-wrap: balance; }
.p-cat { font-size: 12px; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; margin-top: -6px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 14px; }
dt { color: var(--muted); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; padding-top: 3px; }
dd { margin: 0; min-width: 0; }
.mono { font-family: var(--f-mono); font-size: 13.5px; letter-spacing: .04em; }
.linkish { border: 0; background: none; padding: 0; color: var(--text); text-decoration: underline; text-decoration-color: var(--gold-lo); text-underline-offset: 3px; cursor: pointer; text-align: left; }
.p-desc { margin: 0; color: #efd48c; line-height: 1.6; font-weight: 300; font-size: 14.5px; }
.timeline { height: 5px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.timeline b { position: absolute; inset: 0 auto 0 0; background: var(--gold-grad); border-radius: 3px; }
.evlist { display: grid; gap: 4px; }
.evlist button { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 8px 10px; cursor: pointer; text-align: left; }
.evlist button:hover { background: var(--surface-2); border-color: var(--gold-lo); }
.evlist .mono { color: var(--muted); font-size: 12px; flex: none; }
.evlist .nm { min-width: 0; flex: 1; }
.navbox { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.navbox h3 { margin: 0; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 6px 10px; font-size: 13px; letter-spacing: .03em; cursor: pointer; }
.seg button:hover { border-color: var(--gold-lo); }
.seg button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); background: rgb(217 172 71 / .12); }
.custom { display: grid; gap: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 4px; }
.custom .combo input { padding-block: 8px; font-size: 13.5px; }
.custom-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.ghost:hover { border-color: var(--gold); }
.from { font-size: 13px; color: var(--muted); }
.from b { color: var(--text); font-weight: 500; }
.walk { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.walk b { font-family: var(--f-display); font-weight: 600; font-size: 24px; color: var(--gold); }
.walk span { color: var(--muted); font-size: 12.5px; letter-spacing: .06em; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border-radius: 4px; padding: 12px 14px; font-weight: 600; font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; }
.btn.primary { background: var(--gold-grad); color: #2a0d10; }
.btn.primary:hover { filter: brightness(1.08); }
.hint { font-size: 12px; color: var(--faint); margin: 0; line-height: 1.5; }

/* Time bar */
.timebar { display: flex; align-items: center; gap: 14px; padding-block: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; background: rgb(22 5 10 / .6); }
.days { display: flex; gap: 4px; }
.days button { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.days button:hover { border-color: var(--gold-lo); }
.days button[aria-pressed="true"] { background: var(--gold-grad); color: #2a0d10; border-color: var(--gold); font-weight: 600; }
.scrub { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; }
.scrub input { flex: 1; accent-color: var(--gold); min-width: 0; }
.scrub output { font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .06em; min-width: 52px; color: var(--gold-hi); }
.nowbtn { border: 1px solid var(--gold-lo); background: var(--surface); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; }
.nowbtn:hover { border-color: var(--gold); }

@media (min-width: 1280px) { .sub .long { display: inline; } .sub .short { display: none; } }
@media (max-width: 900px) {
  .gutter { padding-left: max(26px, env(safe-area-inset-left, 0px)); padding-right: max(26px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 720px) {
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { flex-wrap: wrap; gap: 10px; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .clock { margin-left: auto; }
  .clock b { font-size: 20px; }
  #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 68%; }
  #panel.enter { animation-name: slideup; }
  @keyframes slideup { from { transform: translateY(30px); opacity: 0; } }
  .sub { letter-spacing: .18em; }
}
</style>

/* ---------- State ---------- */

/* ---------- Walking graph built from the road polylines ---------- */

const routeLayer = el("g", { id: "route" });

/* ---------- Event dots ---------- */

}

/* ---------- Starting points ---------- */
function resolveStart() {

/* ---------- Search ---------- */
function searchAll(q, { includeEvents = true } = {}) {

    .filter((x) => x.s > 0 && (q || (x.e.day === state.day && status(x.e) === "live")))
    .sort((a, b) => b.s - a.s || (a.e.day - b.e.day) || toMin(a.e.start) - toMin(b.e.start)).slice(0, 8).map((x) => x.e);

      return `<button class="res" role="option" data-i="${i}"><span class="ic" style="background:${CATEGORIES[e.cat].color}"></span><span class="tx"><b>${esc(e.title)}</b><small>${esc(P[e.venue].name)} · ${FEST.dayNames[e.day]} ${e.start}–${e.end}</small></span><span class="st ${e.day === state.day && s === "live" ? "live" : ""}">${e.day === state.day ? LABEL[s] : FEST.dayNames[e.day]}</span></button>`; }).join("");

      return `<button class="res" role="option" data-i="${evs.length + i}"><span class="ic place"></span><span class="tx"><b>${esc(p.name)}</b><small>${n ? `${n} event${n > 1 ? "s" : ""} on ${FEST.dayNames[state.day]}` : "On the map"}</small></span></button>`; }).join("");

      <div class="p-top"><span class="pill ${s}">${LABEL[s]}</span><span class="countdown">${cd}</span><button class="close" id="p-close" aria-label="Close details">×</button></div>
      <h2 id="p-title">${esc(e.title)}</h2>
      <div class="p-cat"><span class="sw" style="background:${CATEGORIES[e.cat].color}"></span>${CATEGORIES[e.cat].name}</div>
      ${s === "live" && today ? `<div class="timeline" aria-hidden="true"><b style="width:${pct}%"></b></div>` : ""}
      <dl>
        <dt>When</dt><dd>${FEST.dayNames[e.day]} · <span class="mono">${e.start} – ${e.end}</span></dd>
        <dt>Where</dt><dd><button class="linkish" id="p-place">${esc(p.name)}</button></dd>
        <dt>By</dt><dd>${esc(e.org)}</dd>
      </dl>
      <p class="p-desc">${esc(e.desc)}</p>
      ${navBox(p)}`;
    $("#p-place").onclick = () => select({ kind: "place", id: p.id });
  } else {
    const p = P[sel.id], evs = EVENTS.filter((e) => e.venue === p.id && e.day === state.day).sort((a, b) => toMin(a.start) - toMin(b.start));
    panel.innerHTML = `
      <div class="p-top"><span class="pill place">Place</span><span class="countdown">${evs.length ? `${evs.length} event${evs.length > 1 ? "s" : ""} on ${FEST.dayNames[state.day]}` : `No events on ${FEST.dayNames[state.day]}`}</span><button class="close" id="p-close" aria-label="Close details">×</button></div>
      <h2 id="p-title">${esc(p.name)}</h2>
      ${evs.length ? `<div class="evlist">${evs.map((e) => { const s = status(e); return `<button data-ev="${e.id}"><span class="mono">${e.start}</span><span class="nm">${esc(e.title)}</span><span class="pill ${s}">${LABEL[s]}</span></button>`; }).join("")}</div>` : ""}
      ${navBox(p)}`;
    panel.querySelectorAll("[data-ev]").forEach((b) => b.onclick = () => select({ kind: "event", id: b.dataset.ev }));
  }
  panel.hidden = false;
  $("#p-close").onclick = () => select(null);
  wireNav();
}
function select(sel, focus = true) {
  const opening = !state.sel && sel;
  state.sel = sel;
  if (sel?.kind === "event" && E[sel.id].day !== state.day) { state.day = E[sel.id].day; state.follow = false; renderDays(); renderClock(); renderStrip(); }
  renderDots(); renderPanel(opening);
  if (sel && focus) {
    const [cx, cy] = anchor(P[sel.kind === "event" ? E[sel.id].venue : sel.id]);
    const w = Math.min(vb.w, 900), h = w * aspect(), wide = svg.clientWidth > 720;
    animateTo({ x: cx - w / 2 + (wide ? w * 0.18 : 0), y: cy - h / 2 + (wide ? 0 : h * 0.33), w, h });
  }
}
function setPicking(on) {
  state.picking = on; $("#stage").classList.toggle("picking", on); $("#toast").hidden = !on;
  if (on && innerWidth <= 720) panel.hidden = true; else if (!on) renderPanel();
}
$("#toast-cancel").onclick = () => setPicking(false);

/* ---------- Strip, days, clock ---------- */
function renderStrip() {
  const strip = $("#strip"); strip.replaceChildren();
  const live = EVENTS.filter((e) => e.day === state.day && status(e) === "live" && state.cats.has(e.cat));
  const lab = document.createElement("span"); lab.className = "strip-label"; lab.innerHTML = `<i></i>Live now · ${live.length}`; strip.appendChild(lab);
  if (!live.length) { const em = document.createElement("span"); em.className = "empty"; em.textContent = "Nothing on right now. Amber rings mark what starts soon."; strip.appendChild(em); }
  for (const e of live) { const c = document.createElement("button"); c.className = "chip live-chip"; c.innerHTML = `${esc(e.title)}<small>till ${e.end}</small>`; c.onclick = () => select({ kind: "event", id: e.id }); strip.appendChild(c); }
  $("#fbtn").classList.toggle("on", state.cats.size !== Object.keys(CATEGORIES).length);
}
function renderFilters() {
  const pop = $("#fpop"); pop.hidden = !state.fopen; $("#fbtn").setAttribute("aria-expanded", !!state.fopen);
  if (!state.fopen) return;
  pop.innerHTML = `<h4>Show</h4>` + Object.entries(CATEGORIES).map(([k, c]) => `<button class="row" data-cat="${k}" aria-pressed="${state.cats.has(k)}"><span class="sw" style="background:${c.color}"></span>${c.name}</button>`).join("") +
    `<div class="key"><div><i style="background:var(--live)"></i>Happening now</div><div><i style="border:2.5px solid var(--soon)"></i>Starts within the hour</div><div><i style="background:var(--idle);opacity:.75"></i>Later</div><div><i style="background:var(--ended)"></i>Ended</div></div>`;
  pop.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => { const k = b.dataset.cat; state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k); renderFilters(); renderStrip(); renderDots(); });
}
$("#fbtn").onclick = (ev) => { ev.stopPropagation(); state.fopen = !state.fopen; renderFilters(); };
document.addEventListener("pointerdown", (ev) => { if (state.fopen && !ev.target.closest("#fpop, #fbtn")) { state.fopen = false; renderFilters(); } });
function renderDays() {
  $("#days").innerHTML = FEST.dayNames.map((n, i) => `<button data-day="${i}" aria-pressed="${i === state.day}">${n}</button>`).join("");
  $("#days").querySelectorAll("button").forEach((b) => b.onclick = () => { state.day = +b.dataset.day; state.follow = false; if (state.sel?.kind === "event" && E[state.sel.id].day !== state.day) state.sel = null; refresh(); });
}
function renderClock() {
  $("#t").value = state.t; $("#t-out").textContent = fmt(state.t); $("#clock-time").textContent = fmt(state.t);
  const live = state.follow && todayIdx() === state.day;
  $("#clock-day").textContent = `${FEST.dayNames[state.day]} · ${live ? "live" : "preview"}`;
}
function refresh() { renderDays(); renderClock(); renderStrip(); renderDots(); renderPanel(); }

/* ---------- Pan & zoom ---------- */
function clampVB(v) {
  v.w = Math.max(320, Math.min(maxW(), v.w)); v.h = v.w * aspect();
  v.x = Math.max(WORLD.x, Math.min(WORLD.x + WORLD.w - v.w, v.x));
  v.y = Math.max(WORLD.y, Math.min(WORLD.y + WORLD.h - v.h, v.y));
  return v;
}
function fitVB() { const w = maxW(); return clampVB({ w, x: WORLD.x + (WORLD.w - w) / 2, y: WORLD.y + (WORLD.h - w * aspect()) / 2 }); }
function toSvg(cx, cy) { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(px, py, f) { vb = clampVB({ x: px - (px - vb.x) * f, y: py - (py - vb.y) * f, w: vb.w * f, h: vb.h * f }); setVB(); }
let anim;
function animateTo(target) {
  cancelAnimationFrame(anim); target = clampVB({ ...target });
  const from = { ...vb }, t0 = performance.now(), D = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 480;
  const step = (now) => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
    for (const key of ["x", "y", "w", "h"]) vb[key] = from[key] + (target[key] - from[key]) * e;
    setVB(); if (k < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function updateScale() { const ctm = svg.getScreenCTM(); if (ctm) $("#scalebar").style.width = (50 / M_PER_UNIT) * ctm.a + "px"; }

const ptrs = new Map(); let drag = null, moved = 0, pinchPrev = null;
svg.addEventListener("pointerdown", (ev) => {
  svg.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]); cancelAnimationFrame(anim);
  if (ptrs.size === 1) { drag = { cx: ev.clientX, cy: ev.clientY, vb: { ...vb }, k: 1 / svg.getScreenCTM().a, dot: ev.target.closest(".dot"), place: ev.target.closest("[data-place]") }; moved = 0; }
  else { drag = null; pinchPrev = null; }
});
svg.addEventListener("pointermove", (ev) => {
  if (!ptrs.has(ev.pointerId)) return;
  ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (pinchPrev) { const p = toSvg(m[0], m[1]); zoomAt(p.x, p.y, pinchPrev.d / d);
      const k = 1 / svg.getScreenCTM().a; vb.x -= (m[0] - pinchPrev.m[0]) * k; vb.y -= (m[1] - pinchPrev.m[1]) * k; clampVB(vb); setVB(); }
    pinchPrev = { d, m }; moved = 99; return;
  }
  if (!drag) return;
  const dx = ev.clientX - drag.cx, dy = ev.clientY - drag.cy; moved = Math.max(moved, Math.hypot(dx, dy));
  if (moved > 4) { svg.classList.add("dragging"); vb = clampVB({ ...drag.vb, x: drag.vb.x - dx * drag.k, y: drag.vb.y - dy * drag.k }); setVB(); }
});
const endPtr = (ev) => {
  ptrs.delete(ev.pointerId); svg.classList.remove("dragging");
  if (ev.type === "pointerup" && drag && moved <= 4) {
    if (state.picking) { const p = toSvg(ev.clientX, ev.clientY); state.start = { type: "point", x: Math.round(p.x), y: Math.round(p.y) }; state.customOpen = true; setPicking(false); }
    else if (drag.dot) select({ kind: "event", id: drag.dot.dataset.id });
    else if (drag.place) select({ kind: "place", id: drag.place.dataset.place });
    else if (state.sel) select(null, false);
  }
  if (ptrs.size < 2) pinchPrev = null; if (ptrs.size === 0) drag = null;
};
svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("wheel", (ev) => { ev.preventDefault(); const p = toSvg(ev.clientX, ev.clientY); zoomAt(p.x, p.y, Math.exp(ev.deltaY * 0.0015)); }, { passive: false });
svg.addEventListener("keydown", (ev) => { const d = ev.target.closest?.(".dot"); if (d && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); select({ kind: "event", id: d.dataset.id }); } });
const zoomCenter = (f) => animateTo({ x: vb.x + vb.w * (1 - f) / 2, y: vb.y + vb.h * (1 - f) / 2, w: vb.w * f, h: vb.h * f });
$("#zin").onclick = () => zoomCenter(0.7); $("#zout").onclick = () => zoomCenter(1.4); $("#zfit").onclick = () => animateTo(fitVB());
document.addEventListener("keydown", (ev) => { if (ev.key !== "Escape") return; if (state.picking) setPicking(false); else if (state.sel && !ev.target.closest?.("input")) select(null, false); });
new ResizeObserver(() => {
  if (!svg.clientWidth) return;
  const wasFit = vb.w >= fitW - 1, cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2, w = vb.w;
  fitW = maxW();
  vb = wasFit ? fitVB() : clampVB({ w, x: cx - w / 2, y: cy - (w * aspect()) / 2 });
  setVB();
}).observe(svg);

/* ---------- Time controls ---------- */
$("#t").addEventListener("input", (ev) => { state.t = +ev.target.value; state.follow = false; renderClock(); renderStrip(); renderDots(); renderPanel(); });
$("#nowbtn").onclick = () => { const ti = todayIdx(); if (ti >= 0) state.day = ti; state.follow = true; state.t = Math.max(480, Math.min(1380, nowMin())); refresh(); };
setInterval(() => { if (!state.follow) return; const t = Math.max(480, Math.min(1380, nowMin()));
  if (t !== state.t && !document.activeElement?.matches?.("#panel input")) { state.t = t; refresh(); } }, 20000);

/* ---------- Boot ---------- */
drawBase(); svg.appendChild(routeLayer); svg.appendChild(dotLayer); vb = fitVB(); fitW = vb.w; setVB();
if (todayIdx() >= 0) { state.day = todayIdx(); state.follow = true; state.t = Math.max(480, Math.min(1380, nowMin())); }
refresh();
</script>


</body></html>
